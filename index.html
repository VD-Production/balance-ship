<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Корабль равновесия</title>
  <link rel="canonical" href="https://vd-prod.com/balance-ship/">
  <script>
    const destination = new URL('./balance-ship/', window.location.href);
    destination.search = window.location.search;
    destination.hash = window.location.hash;
    if (destination.protocol === 'file:') {
      destination.pathname += 'index.html';
    } else {
      // The old page at this address redirected back here and may still be cached.
      destination.searchParams.set('__pages_redirect', '1');
    }
    window.location.replace(destination.href);
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=./balance-ship/index.html?__pages_redirect=1"></noscript>
</head>
<body>
  <a href="./balance-ship/index.html?__pages_redirect=1">Открыть «Корабль равновесия»</a>
</body>
</html>
